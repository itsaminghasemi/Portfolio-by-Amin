    <link rel="icon" type="image/png" sizes="512x512" href="../images/Favicons/android-chrome-512x512.png">

    <link rel="stylesheet" href="/global.css" />
    <link rel="stylesheet" href="/css/pig-game.css" />
    <title>Pig Game</title>
</head>

<body class="pig-game-page">

    <!-- GLOBAL HEADER -->
    <header class="glass-navbar fade-in-up">
        <div class="navbar-container">
            <a href="../index.html" class="nav-logo">
                <span class="logo-icon">✨</span>
                <span>Amin Ghasemi</span>
            </a>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <nav class="nav-links">
                <a href="../index.html" class="nav-link">Vitrine</a>
                <a href="about.html" class="nav-link">Who Am I</a>
                <a href="social.html" class="nav-link active" aria-current="page">Me On Social</a>
                <a href="contact.html" class="nav-link">Contact Us</a>
                <a href="guess-my-number.html" class="nav-link">Guess My Number</a>
                <a href="modal-window.html" class="nav-link" id="modal-toggle">Modal Window</a>
                <a href="pig-game.html" class="nav-link active">Pig Game</a>
            </nav>
        </div>
    </header>

    <!-- PREMIUM PIG GAME -->
    <main class="pig-game-container">
        <section class="player player--0 player--active">
            <h2 class="name" id="name--0">Player 1</h2>
            <p class="score" id="score--0">0</p>
            <div class="current">
                <p class="current-label">Current</p>
                <p class="current-score" id="current--0">0</p>
            </div>
        </section>

        <div class="game-center">
            <img src="/images/dice/dice-5.png" alt="Dice" class="dice hidden" />
            <div class="controls">
                <button class="btn btn--roll">🎲 Roll Dice</button>
                <button class="btn btn--hold">📥 Hold</button>
                <button class="btn btn--new">🔄 New Game</button>
            </div>
        </div>

        <section class="player player--1">
            <h2 class="name" id="name--1">Player 2</h2>
            <p class="score" id="score--1">0</p>
            <div class="current">
                <p class="current-label">Current</p>
                <p class="current-score" id="current--1">0</p>
            </div>
        </section>
    </main>

    <!-- GLOBAL FOOTER -->
    <footer class="glass-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <p>Building beautiful and functional digital experiences with code and creativity.</p>
            </div>
        </div>
        <div class="footer-bottom">

        </div>

    <script src="/js/pig-game.js"></script>
