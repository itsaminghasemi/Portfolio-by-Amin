    <link rel="stylesheet" href="/global.css" />
    <link rel="stylesheet" href="/css/guess-my-number.css" />
    <title>Guess My Number!</title>
  </head>
  <body>
    <header>
      <h1>Guess My Number!</h1>
      <p class="between">(Between 1 and 20)</p>
      <button class="btn again">Again!</button>
      <div class="number">?</div>
    </header>

    <header class="glass-navbar fade-in-up">
      <div class="navbar-container">
        <a href="../index.html" class="nav-logo">
          <span class="logo-icon">✨</span>
          <span>Amin Ghasemi</span>
        </a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle" />
        <label for="nav-toggle" class="nav-toggle-label">
          <span></span>
          <span></span>
          <span></span>
        </label>
        <nav class="nav-links">
          <a href="../index.html" class="nav-link">Vitrine</a>
          <a href="about.html" class="nav-link">Who Am I</a>
          <a href="social.html" class="nav-link">Me On Social</a>
          <a href="contact.html" class="nav-link">Contact Us</a>
          <a
            href="guess-my-number.html"
            class="nav-link active"
            aria-current="page"
            >Guess My Number</a
          >
        </nav>
      </div>
    </header>

    <main>
      <section class="left">
        <input type="number" class="guess" />
        <button class="btn check">Check!</button>
      </section>

      <section class="right">
        <p class="message">Start guessing...</p>
        <p class="label-score">💯 Score: <span class="score">20</span></p>
        <p class="label-highscore">
          🥇 Highscore: <span class="highscore">0</span>
        </p>
      </section>
    </main>

    <script src="/js/guess-my-number.js"></script>
  </body>
